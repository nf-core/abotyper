name: Python tests (bin/)
# Unit and golden-output tests for the typing scripts in bin/, plus ruff.
on:
  pull_request:
    paths:
      - "bin/**"
      - "tests/python/**"
      - "assets/refs/abo_variant_panel.*"
      - "ruff.toml"
      - ".github/workflows/python-tests.yml"
  push:
    branches: [dev, master]
    paths:
      - "bin/**"
      - "tests/python/**"
      - "assets/refs/abo_variant_panel.*"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/python/requirements.txt
      - name: Install test dependencies
        run: pip install -r tests/python/requirements.txt
      - name: Ruff
        run: ruff check bin tests/python
      - name: Pytest
        run: python -m pytest tests/python -q
