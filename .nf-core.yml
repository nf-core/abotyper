lint:
  files_exist:
    - .github/workflows/linting_comment.yml
  files_unchanged:
    - .gitattributes
    - .gitignore
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
    - .github/workflows/branch.yml
  nextflow_config:
    - config_defaults:
        - params.fasta
        - params.fai
        - params.multiqc_logo
        - params.logo
        - params.abo_bed
        - params.abo_clair3_region_bed
        - params.abo_panel
        - params.abo_reference_fasta
        - params.abo_reference_fai
  nf_test_content: false
nf_core_version: 4.2.1
repository_type: pipeline
template:
  author: "@fmobegi"
  description: A pipeline for characterising the Human Blood Group and Red Cell Antigens
    using Oxford Nanopore third-generation sequencing data.
  force: false
  is_nfcore: true
  name: abotyper
  org: nf-core
  outdir: .
  version: 1.0.0
