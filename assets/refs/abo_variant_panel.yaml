%YAML 1.1
---
# ===========================================================================
# ABO Variant Panel — nf-core/abotyper
# ===========================================================================
#
# This file is the SINGLE SOURCE OF TRUTH for every diagnostic position used
# by the abotyper pipeline (panel_to_bed.py, clair2metrics.py,
# clair2haplotypes.py, predict_abo_phenotype.py, aggregate_abo_reports.py).
#
# Adding a new variant to the assay = adding a row here. No script needs to
# be edited or redeployed.
#
# An equivalent flat table lives in abo_variant_panel.csv (same content,
# generated from this file) for lab staff who prefer to review/edit variants
# in Excel. abo_panel.py can load either format interchangeably — pass
# whichever you prefer with --panel.
#
# ---------------------------------------------------------------------------
# COORDINATE SYSTEMS (three, populated at different stages of assay maturity)
# ---------------------------------------------------------------------------
#   legacy_exon6_pos / legacy_exon7_pos
#       1-based position within the OLD, separate exon6-only (~135 bp) and
#       exon7-only (~815 bp) mini-amplicon references used by pipeline
#       v1.x. Populated only for the 24 positions that assay already
#       covered. Kept so v1.x BAMs/pileups remain analysable.
#
#   amplicon_pos
#       1-based position within the NEW single ~6.7 kb long-read amplicon
#       (Goebel-IN1-forward / Wu-3'UTR-reverse; Mobegi et al. 2025, IJMS
#       26(12):5443) that spans exons 2-7. Left blank ("") until you run
#       calibrate_panel_positions.py against your finalised reference
#       FASTA — see that script's docstring. Every script in this bundle
#       falls back gracefully to legacy_exonN_pos when amplicon_pos is
#       blank, so nothing breaks before calibration; new (exon2-6) entries
#       simply won't be scored until the combined amplicon is in use AND
#       the panel is calibrated.
#
#   cdna_pos / cdna_change
#       Stable HGVS cDNA numbering (NM_020469.3), matching ISBT ABO allele
#       nomenclature. Never changes with assay redesign — use this as the
#       durable identifier when discussing variants with the ISBT table.
#
# ---------------------------------------------------------------------------
# call_rule  (how aggregate_abo_reports.py / predict_abo_phenotype.py score it)
# ---------------------------------------------------------------------------
#   primary_biallelic
#       Used for the handful of true ABO-type-defining positions (O1, A/B
#       discriminators, O2, A1/A2). ref_call_label / alt_call_label are the
#       human-readable calls; ref_threshold_pct / alt_threshold_pct /
#       het_band_pct parametrise the exact thresholds (this reproduces the
#       original per-position asymmetric thresholds from get_type() /
#       get_type_exon6(), just moved into data). alt_base may be "del" or
#       "ins" as well as A/G/C/T — the engine reads the matching pileup
#       column automatically.
#
#   named_marker
#       Used for every subtype/subgroup-flagging SNP or indel (A2/A3/Am/
#       Aweak/Ael, Bweak/Bel/B3, Bw, B(A), cisAB, O-null cassette members).
#       If pct(alt_base) >= variant_threshold_pct (and min_reads is met),
#       the marker fires and is reported as
#       "<Confirmed|Possible> <subtype_label>(<cdna_change>:<alt>=<pct>%)".
#       Confirmed if >=80%, Possible otherwise. category groups markers for
#       the generic scan_category_markers() scanner in
#       aggregate_abo_reports.py.
#
# ---------------------------------------------------------------------------
# category values
# ---------------------------------------------------------------------------
#   primary   — core O1/O2/A-or-O/B discriminators (drive the main
#               phenotype/genotype decision tree; do not remove)
#   a2_panel  — legacy generic A2-subtype "variant/blank" scan (backward
#               compatible with pipeline v1.2.0 behaviour)
#   a2 / a3 / am / aweak / ael / bweak / bel / b3 / bw / ba / cisab / onull
#               — named-subtype marker categories, each independently
#               scannable via scan_category_markers()
#   sv        — structural variants too large for pileup-based calling;
#               tracked here for documentation/QC only (see
#               structural_variants section below), not scored by the
#               per-base engines.
#
# ---------------------------------------------------------------------------

meta:
  panel_version: "2.3.0"
  isbt_allele_table_version: "v9 (blooddatabase.isbtweb.org/system/ABO)"
  isbt_allele_table_checked: "2026-10-16"
  isbt_allele_table_release_date: "not stated in the table file; set from the ISBT database release notes"
  isbt_coverage_table: "assets/refs/abo_isbt_v9_coverage.tsv (every ISBT v9 / v1.1 DNA change and where the panel handles it)"
  source: "nf-core/abotyper legacy panel (v1.2.0) + ISBT ABO allele table v9"
  reference_transcript: "NM_020469.3"
  assay_reference: "Mobegi et al. 2025, Int J Mol Sci 26(12):5443 (doi:10.3390/ijms26125443)"
  notes: >
    amplicon_pos fields are intentionally blank pending calibration against
    the finalised combined exon2-7 reference FASTA. See
    calibrate_panel_positions.py.

  ng006669_2_reference: "Fully calibrated against user-supplied NG_006669.2 GenBank annotation (mRNA/CDS join() feature): all 51 panel positions now have a verified ng006669_2_pos, cross-checked against the actual NG_006669.2 sequence with zero mismatches. Intron positions (aweak_intron6_374, aweak_intron2_98, b3_intron3_155, abantu_intron4_203) anchor to the first of their listed HGVS intronic offsets; see each row's notes."
  assay_reference_note: Combined reference is the UNTRIMMED NG_006669.2 record (42,144 bp) -- amplicon_pos is therefore identical to ng006669_2_pos for every row (zero offset). Positions upstream of exon 2 (~NG 1-18000) will show zero coverage in aligned samples since the actual PCR amplicon only spans exon2-7; this is expected and harmless.
