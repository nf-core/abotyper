# ===========================================================================
# STRUCTURAL VARIANTS — too large for per-base pileup calling.
# Documented for QC/validation planning; NOT consumed by the SNP/indel
# scanning engines. A future long-read SV caller (e.g. flag reads with
# alignment gaps exceeding N bp against the reference) would detect these.
# ===========================================================================
structural_variants:
  - id: o16_large_deletion
    cdna_change: "c.204-98_*3252del"
    exon: "Intron 4 - Exon 7 (spans 3' UTR)"
    size_bp_approx: 3150
    associated_alleles: "ABO*O.16"
    notes: >
      A ~3.15 kb deletion spanning intron 4 through the 3' UTR. Should be
      directly visible as a large gap/soft-clip in a single ONT read
      spanning the combined 6.7 kb amplicon, PROVIDED the Wu 3'UTR
      reverse primer sits downstream of cDNA position *3252. Recommend
      validating with a known ABO*O.16 reference sample once available;
      until then this allele will silently type as apparent homozygosity
      for whatever remains on the other allele (a false-homozygote risk
      worth flagging in your validation plan).
    source: ISBT_v9

  - id: exon1_start_codon_variants
    cdna_change: "c.1A>G, c.2T>C"
    exon: "Exon 1"
    associated_alleles: "ABO*AW.13;ABO*AW.16"
    notes: >
      TRUE ASSAY GAP: exon 1 sits upstream of the Goebel intron-1 forward
      primer and is not expected to be captured by the combined
      exon2-7 amplicon. Confirm the exact primer coordinate before ruling
      this out entirely; if genuinely outside the amplicon, capturing
      these two start-codon variants requires a new forward primer
      further upstream (exon 1 / promoter region), not a software change.
    source: ISBT_v9
