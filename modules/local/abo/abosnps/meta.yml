---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: GETABOSNPS
description: Extract ABO-specific SNPs from variant frequency data and predict ABO phenotype
keywords:
  - abo
  - blood typing
  - phenotype prediction
  - snp analysis
  - variant calling
  - genotyping
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/
      tool_dev_url: https://github.com/python/cpython
      licence: ["Python Software Foundation License"]
  - pandas:
      description: Powerful data structures for data analysis, time series, and statistics
      homepage: https://pandas.pydata.org/
      documentation: https://pandas.pydata.org/docs/
      tool_dev_url: https://github.com/pandas-dev/pandas
      licence: ["BSD-3-Clause"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'sample1', single_end:false, exon:'exon6' ]`
      required: true
  - variants_freq:
      type: file
      description: Variant frequency file containing nucleotide frequencies at each position
      pattern: "*.{tsv,txt,freq}"
      required: true
  - coverage:
      type: file
      description: Coverage file containing depth information for genomic positions
      pattern: "*.{cov,coverage,txt}"
      required: true
  - exon_n:
      type: string
      description: Exon identifier (e.g., 'exon6', 'exon7') specifying which ABO exon is being analyzed
      required: true

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'sample1', single_end:false, exon:'exon6' ]`
  - phenotype:
      type: file
      description: ABO phenotype prediction results file
      pattern: "*.ABOPhenotype.txt"
  - log:
      type: file
      description: Log file containing processing information and any warnings/errors
      pattern: "*.log.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@fmobegi"
maintainers:
  - "@fmobegi"
