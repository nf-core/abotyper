# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: ABO_CLAIR2METRICS
description: Convert a Clair3 gVCF into HAPLOSCAN-format AlignmentStatistics.tsv metrics for the ABO panel positions
keywords:
  - abo
  - blood typing
  - variant calling
  - genotyping
  - clair3
  - gvcf
tools:
  - abotyper-core:
      description: ABO blood group typing logic of nf-core/abotyper, as a Python package and command-line tools
      homepage: https://github.com/fmobegi/abotyper-core
      documentation: https://github.com/fmobegi/abotyper-core#readme
      tool_dev_url: https://github.com/fmobegi/abotyper-core
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
        required: true
    - gvcf:
        type: file
        description: Clair3 merge_output.gvcf.gz (run with --gvcf)
        pattern: "*.gvcf.gz"
        required: true
  - - panel_file:
        type: file
        description: ABO variant panel file (abo_variant_panel.yaml / .json / .csv / .tsv)
        pattern: "*.{yaml,yml,json,csv,tsv}"
        required: true

output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - "*.AlignmentStatistics.tsv":
          type: file
          description: Per-position nucleotide frequency metrics, same format as HAPLOSCAN's output
          pattern: "*.AlignmentStatistics.tsv"
  versions_abotyper_core:
    - - ${task.process}:
          type: string
          description: Name of the process
      - abotyper-core:
          type: string
          description: Name of the tool
      - python3 -c "import abotyper_core; print(abotyper_core.__version__)":
          type: eval
          description: The expression to obtain the version of abotyper-core

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Name of the process
      - abotyper-core:
          type: string
          description: Name of the tool
      - python3 -c "import abotyper_core; print(abotyper_core.__version__)":
          type: eval
          description: The expression to obtain the version of abotyper-core

authors:
  - "@fmobegi"
maintainers:
  - "@fmobegi"
