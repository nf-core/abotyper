# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: ABO_PANEL2BED
description: Generate a BED file of ABO panel diagnostic positions from the variant panel YAML, for Clair3 --bed_fn / bcftools view -R
keywords:
  - abo
  - blood typing
  - bed
  - variant calling
  - genotyping
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/
      tool_dev_url: https://github.com/python/cpython
      licence: ["Python Software Foundation License"]
  - pyyaml:
      description: YAML parser and emitter for Python
      homepage: https://pyyaml.org/
      documentation: https://pyyaml.org/wiki/PyYAMLDocumentation
      tool_dev_url: https://github.com/yaml/pyyaml
      licence: ["MIT"]

input:
  - - panel_file:
        type: file
        description: ABO variant panel file (abo_variant_panel.yaml / .json / .csv / .tsv)
        pattern: "*.{yaml,yml,json,csv,tsv}"
        required: true

output:
  bed:
    - - "*.bed":
          type: file
          description: BED file of panel diagnostic positions, indel/homopolymer rows padded
          pattern: "*.bed"
  versions_python:
    - - ${task.process}:
          type: string
          description: Name of the process
      - python:
          type: string
          description: Name of the tool
      - python3 --version | sed "s/Python //":
          type: eval
          description: The expression to obtain the version of Python
  versions_pyyaml:
    - - ${task.process}:
          type: string
          description: Name of the process
      - pyyaml:
          type: string
          description: Name of the library
      - python3 -c "import yaml; print(yaml.__version__)":
          type: eval
          description: The expression to obtain the version of pyyaml

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Name of the process
      - python:
          type: string
          description: Name of the tool
      - python3 --version | sed "s/Python //":
          type: eval
          description: The expression to obtain the version of Python
    - - ${task.process}:
          type: string
          description: Name of the process
      - pyyaml:
          type: string
          description: Name of the library
      - python3 -c "import yaml; print(yaml.__version__)":
          type: eval
          description: The expression to obtain the version of pyyaml

authors:
  - "@fmobegi"
maintainers:
  - "@fmobegi"
