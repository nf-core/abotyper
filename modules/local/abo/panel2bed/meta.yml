# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: ABO_PANEL2BED
description: Generate a BED file of ABO panel diagnostic positions from the variant panel YAML, for Clair3 --bed_fn / bcftools view -R
keywords:
  - abo
  - blood typing
  - bed
  - variant calling
  - genotyping
tools:
  - abotyper-core:
      description: ABO blood group typing logic of nf-core/abotyper, as a Python package and command-line tools
      homepage: https://github.com/fmobegi/abotyper-core
      documentation: https://github.com/fmobegi/abotyper-core#readme
      tool_dev_url: https://github.com/fmobegi/abotyper-core
      licence: ["MIT"]

input:
  - - panel_file:
        type: file
        description: ABO variant panel file (.yaml / .json / .csv / .tsv); pass [] for the panel bundled with abotyper-core
        pattern: "*.{yaml,yml,json,csv,tsv}"
        required: true

output:
  bed:
    - - "*.bed":
          type: file
          description: BED file of panel diagnostic positions, indel/homopolymer rows padded
          pattern: "*.bed"
  versions_abotyper_core:
    - - ${task.process}:
          type: string
          description: Name of the process
      - abotyper-core:
          type: string
          description: Name of the tool
      - python3 -c "import abotyper_core; print(abotyper_core.__version__)":
          type: eval
          description: The expression to obtain the version of abotyper-core

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Name of the process
      - abotyper-core:
          type: string
          description: Name of the tool
      - python3 -c "import abotyper_core; print(abotyper_core.__version__)":
          type: eval
          description: The expression to obtain the version of abotyper-core

authors:
  - "@fmobegi"
maintainers:
  - "@fmobegi"
