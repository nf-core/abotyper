# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: ABO_SNPS2PHENO
description: Aggregate ABO SNP results from multiple samples and generate comprehensive phenotype reports
keywords:
  - abo
  - blood typing
  - phenotype
  - aggregation
  - reporting
  - snp analysis
  - genotyping
  - excel
  - csv
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/
      tool_dev_url: https://github.com/python/cpython
      licence: ["Python Software Foundation License"]
  - pandas:
      description: Powerful data structures for data analysis, time series, and statistics
      homepage: https://pandas.pydata.org/
      documentation: https://pandas.pydata.org/docs/
      tool_dev_url: https://github.com/pandas-dev/pandas
      licence: ["BSD-3-Clause"]
  - pyyaml:
      description: YAML parser and emitter for Python
      homepage: https://pyyaml.org/
      documentation: https://pyyaml.org/wiki/PyYAMLDocumentation
      tool_dev_url: https://github.com/yaml/pyyaml
      licence: ["MIT"]
  - xlsxwriter:
      description: Python module for creating Excel XLSX files
      homepage: https://xlsxwriter.readthedocs.io/
      documentation: https://xlsxwriter.readthedocs.io/
      tool_dev_url: https://github.com/jmcnamara/XlsxWriter
      licence: ["BSD-2-Clause"]
  - openpyxl:
      description: Python library to read/write Excel 2010 xlsx/xlsm/xltx/xltm files
      homepage: https://openpyxl.readthedocs.io/
      documentation: https://openpyxl.readthedocs.io/
      tool_dev_url: https://foss.heptapod.net/openpyxl/openpyxl
      licence: ["MIT"]

input:
  - sample_ids:
      type: list
      description: Sample IDs to aggregate; each names its files as <id>.<suffix>
  - sample_files:
      type: file
      description: |
        Per-sample files read by aggregate_abo_reports.py (*.ABOPhenotype.txt, *.Haplotypes.tsv,
        *.evidence_status.tsv, *.concordance.tsv, *.coverage.txt, *.stats, *.flagstat)
      pattern: "*"
      ontologies: []
  - controls:
      type: file
      description: |
        Optional two-column TSV (sample ID, control type) from the samplesheet `control` column;
        `negative` and `positive` mark controls, empty marks a sample. Pass [] for none.
      pattern: "*.tsv"
      ontologies: []
  - panel_file:
      type: file
      description: ABO variant panel file (abo_variant_panel.yaml / .json / .csv / .tsv)
      pattern: "*.{yaml,yml,json,csv,tsv}"
      ontologies: []

output:
  txt:
    - - "ABO_result.txt":
          type: file
          description: Text file containing aggregated ABO phenotype results in human-readable format
          pattern: "ABO_result.txt"
  xls:
    - - "ABO_result.xlsx":
          type: file
          description: Excel file containing comprehensive ABO phenotype results with formatting
          pattern: "ABO_result.xlsx"
  log:
    - - "ABO_results.log":
          type: file
          description: Log file containing processing information, warnings, and errors from aggregation
          pattern: "ABO_results.log"
  csv:
    - - "final_export.csv":
          type: file
          description: CSV file containing final exported ABO results suitable for downstream analysis
          pattern: "final_export.csv"
  qc:
    - - "ABO_run_qc.txt":
          type: file
          description: Run-level QC summary (research-use statement, depth and evidence checks per sample)
          pattern: "ABO_run_qc.txt"
  mqc:
    - - "ABO_evidence_summary_mqc.tsv":
          type: file
          description: Per-sample evidence summary (Clair3 and BAM pileup) as a MultiQC custom-content table
          pattern: "ABO_evidence_summary_mqc.tsv"
  versions_python:
    - - ${task.process}:
          type: string
          description: Name of the process
      - python:
          type: string
          description: Name of the tool
      - python --version | sed "s/Python //":
          type: eval
          description: The expression to obtain the version of Python
  versions_pandas:
    - - ${task.process}:
          type: string
          description: Name of the process
      - pandas:
          type: string
          description: Name of the library
      - python -c "import pandas; print(pandas.__version__)":
          type: eval
          description: The expression to obtain the version of pandas
  versions_pyyaml:
    - - ${task.process}:
          type: string
          description: Name of the process
      - pyyaml:
          type: string
          description: Name of the library
      - python -c "import yaml; print(yaml.__version__)":
          type: eval
          description: The expression to obtain the version of PyYAML
  versions_xlsxwriter:
    - - ${task.process}:
          type: string
          description: Name of the process
      - xlsxwriter:
          type: string
          description: Name of the library
      - python -c "import xlsxwriter; print(xlsxwriter.__version__)":
          type: eval
          description: The expression to obtain the version of xlsxwriter
  versions_script:
    - - ${task.process}:
          type: string
          description: Name of the process
      - aggregate_abo_reports.py:
          type: string
          description: Name of the pipeline script
      - aggregate_abo_reports.py --version | sed "s/.* //":
          type: eval
          description: The expression to obtain the version of aggregate_abo_reports.py
  versions_panel:
    - - ${task.process}:
          type: string
          description: Name of the process
      - abo_variant_panel:
          type: string
          description: The variant panel
      - abo_panel.py --panel ${panel_file} --panel-version:
          type: eval
          description: The expression to obtain the version of abo_variant_panel

