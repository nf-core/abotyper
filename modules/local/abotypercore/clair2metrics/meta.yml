# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: ABOTYPERCORE_CLAIR2METRICS
description: Convert a Clair3 gVCF into HAPLOSCAN-format AlignmentStatistics.tsv metrics for the ABO panel positions
keywords:
  - abo
  - blood typing
  - variant calling
  - genotyping
  - clair3
  - gvcf
tools:
  - abotyper-core:
      description: ABO blood group typing logic of nf-core/abotyper, as a Python package and command-line tools
      homepage: https://github.com/fmobegi/abotyper-core
      documentation: https://github.com/fmobegi/abotyper-core#readme
      tool_dev_url: https://github.com/fmobegi/abotyper-core
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
        required: true
    - gvcf:
        type: file
        description: Clair3 merge_output.gvcf.gz (run with --gvcf)
        pattern: "*.gvcf.gz"
        required: true
        ontologies:
          - edam: http://edamontology.org/format_3989 # GZIP format
  - panel_file:
      type: file
      description: ABO variant panel file (.yaml / .json / .csv / .tsv); pass [] for the panel bundled with abotyper-core
      pattern: "*.{yaml,yml,json,csv,tsv}"
      required: true

      ontologies:
        - edam: http://edamontology.org/format_3750 # YAML
        - edam: http://edamontology.org/format_3464 # JSON
        - edam: http://edamontology.org/format_3752 # CSV
        - edam: http://edamontology.org/format_3475 # TSV
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - "*.AlignmentStatistics.tsv":
          type: file
          description: Per-position nucleotide frequency metrics, same format as HAPLOSCAN's output
          pattern: "*.AlignmentStatistics.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_abotyper_core:
    - - ${task.process}:
          type: string
          description: Name of the process
      - abotyper-core:
          type: string
          description: Name of the tool
      - python3 -c "import abotyper_core; print(abotyper_core.__version__)":
          type: eval
          description: The expression to obtain the version of abotyper-core

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Name of the process
      - abotyper-core:
          type: string
          description: Name of the tool
      - python3 -c "import abotyper_core; print(abotyper_core.__version__)":
          type: eval
          description: The expression to obtain the version of abotyper-core

authors:
  - "@fmobegi"
maintainers:
  - "@fmobegi"
