# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: ABOTYPERCORE_PREDICTPHENOTYPE
description: Extract ABO-specific SNPs from variant frequency data and predict ABO phenotype
keywords:
  - abo
  - blood typing
  - phenotype prediction
  - snp analysis
  - variant calling
  - genotyping
tools:
  - abotyper-core:
      description: ABO blood group typing logic of nf-core/abotyper, as a Python package and command-line tools
      homepage: https://github.com/fmobegi/abotyper-core
      documentation: https://github.com/fmobegi/abotyper-core#readme
      tool_dev_url: https://github.com/fmobegi/abotyper-core
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
        required: true
    - variants_freq:
        type: file
        description: |
          Per-position allele frequency file (AlignmentStatistics.tsv), produced
          by ABOTYPERCORE_CLAIR2METRICS. Auto-detects which exon(s) it covers from panel
          position overlap -- no separate exon parameter needed.
        pattern: "*.{tsv,txt,freq}"
        required: true
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - coverage:
        type: file
        description: Coverage file containing depth information for genomic positions
        pattern: "*.{cov,coverage,txt}"
        required: true
        ontologies: []
  - panel_file:
      type: file
      description: ABO variant panel file (.yaml / .json / .csv / .tsv); pass [] for the panel bundled with abotyper-core
      pattern: "*.{yaml,yml,json,csv,tsv}"
      required: true

      ontologies:
        - edam: http://edamontology.org/format_3750 # YAML
        - edam: http://edamontology.org/format_3464 # JSON
        - edam: http://edamontology.org/format_3752 # CSV
        - edam: http://edamontology.org/format_3475 # TSV
output:
  phenotype:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1', single_end:false, exon:'exon6' ]
      - "*.ABOPhenotype.txt":
          type: file
          description: ABO phenotype prediction results file
          pattern: "*.ABOPhenotype.txt"
          ontologies: []
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1', single_end:false, exon:'exon6' ]
      - "*.log.txt":
          type: file
          description: Log file containing processing information and any warnings/errors
          pattern: "*.log.txt"
          ontologies: []
  versions_abotyper_core:
    - - ${task.process}:
          type: string
          description: Name of the process
      - abotyper-core:
          type: string
          description: Name of the tool
      - python3 -c "import abotyper_core; print(abotyper_core.__version__)":
          type: eval
          description: The expression to obtain the version of abotyper-core

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Name of the process
      - abotyper-core:
          type: string
          description: Name of the tool
      - python3 -c "import abotyper_core; print(abotyper_core.__version__)":
          type: eval
          description: The expression to obtain the version of abotyper-core

authors:
  - "@fmobegi"
maintainers:
  - "@fmobegi"
