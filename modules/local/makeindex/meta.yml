---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: MAKEINDEX
description: Convert FASTA index files (FAI) to BED format for genomic interval processing
keywords:
  - fai
  - bed
  - genomic intervals
  - file conversion
  - indexing
  - abo
  - exon
tools:
  - awk:
      description: Pattern scanning and processing language
      homepage: https://www.gnu.org/software/gawk/
      documentation: https://www.gnu.org/software/gawk/manual/
      tool_dev_url: https://git.savannah.gnu.org/cgit/gawk.git
      licence: ["GPL-3.0-or-later"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information for exon6
        e.g. `[ id:'sample1', exon:'exon6' ]`
      required: true
  - exon6fai:
      type: file
      description: FASTA index file for exon6 reference sequence
      pattern: "*.fai"
      required: true
  - meta1:
      type: map
      description: |
        Groovy Map containing sample information for exon7
        e.g. `[ id:'sample1', exon:'exon7' ]`
      required: true
  - exon7fai:
      type: file
      description: FASTA index file for exon7 reference sequence
      pattern: "*.fai"
      required: true

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information for exon6
        e.g. `[ id:'sample1', exon:'exon6' ]`
  - exon6bed:
      type: file
      description: BED format file containing genomic intervals for exon6
      pattern: "*_exon6.bed"
  - meta1:
      type: map
      description: |
        Groovy Map containing sample information for exon7
        e.g. `[ id:'sample1', exon:'exon7' ]`
  - exon7bed:
      type: file
      description: BED format file containing genomic intervals for exon7
      pattern: "*_exon7.bed"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@fmobegi"
maintainers:
  - "@fmobegi"
