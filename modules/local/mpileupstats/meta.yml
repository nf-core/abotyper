# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "samtools_mpileupcustom"
description: Custom mpileup-based variant inspection pipeline for ABO allele analysis using samtools output and Python processing.
keywords:
  - mpileup
  - variant calling
  - ABO
  - samtools
  - pileup
tools:
  - samtools:
      description: Tools for manipulating SAM, BAM and CRAM files.
      homepage: "http://www.htslib.org"
      documentation: "http://www.htslib.org/doc/samtools.html"
      tool_dev_url: "https://github.com/samtools/samtools"
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT"]
      identifier: biotools:samtools

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'sample1', single_end:false ]`
  - pileup:
      type: file
      description: Input mpileup file generated by samtools
      pattern: "*.pileup"
      ontologies:
        - edam:format_3003
  - fasta:
      type: file
      description: Reference FASTA file used during pileup generation
      pattern: "*.fa"
      ontologies:
        - edam:format_1929

output:
  - tsv:
      type: file
      description: Table summarizing alignment statistics and nucleotide frequencies
      pattern: "*.AlignmentStatistics.tsv"
      ontologies:
        - edam:format_3754
  - txt:
      type: file
      description: ABO polymorphisms extracted from the read data
      pattern: "ABOReadPolymorphisms.txt"
      ontologies:
        - edam:format_3475
  - versions:
      type: file
      description: File containing software versions used during execution
      pattern: "versions.yml"

authors:
  - "@fmobegi"
maintainers:
  - "@fmobegi"
