# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "PREDICTABOPHENOTYPE"
description: |
  Predicts ABO phenotype and extended genotype by combining variant frequency data
  with BAM coverage, extracting ABO-specific SNPs, and aggregating per-sample results
  into a unified report. Stages haplotype tables (from ABOTYPERCORE_CLAIR2HAPLOTYPES) alongside
  phenotype files to enable PhaseConfidence scoring and Bw/B(A) subtype detection in
  abotyper-aggregate.
keywords:
  - abo
  - blood typing
  - phenotype prediction
  - genotyping
  - haplotype phasing
  - bw subtype
  - snp analysis
  - variant frequency
components:
  - abotypercore/predictphenotype
  - abotypercore/aggregate
input:
  - ch_variants_freq:
      type: channel
      description: |
        Channel containing per-position allele frequency files (AlignmentStatistics.tsv)
        with exon metadata, produced by ABOTYPERCORE_CLAIR2METRICS.
        Structure: [ val(meta), path(*.AlignmentStatistics.tsv) ]
      pattern: "*.AlignmentStatistics.tsv"
  - ch_bam_coverage:
      type: channel
      description: |
        Channel containing BAM coverage files with exon metadata,
        produced by SAMTOOLS_COVERAGE via MINIMAP2_ALIGN_READS.
        Structure: [ val(meta), path(*.coverage.txt) ]
      pattern: "*.coverage.txt"
  - ch_haplotypes:
      type: channel
      description: |
        Channel containing haplotype tables (Haplotypes.tsv) with exon metadata,
        produced by ABOTYPERCORE_CLAIR2HAPLOTYPES. Staged into ABOTYPERCORE_AGGREGATE with the other per-sample
        files so that abotyper-aggregate can compute PhaseConfidence scores.
        Structure: [ val(meta), path(*.Haplotypes.tsv) ]
      pattern: "*.Haplotypes.tsv"
  - ch_evidence_status:
      type: channel
      description: "[ val(meta), path(*.evidence_status.tsv) ] from ABOTYPERCORE_PILEUP2METRICS"
  - ch_concordance:
      type: channel
      description: "[ val(meta), path(*.concordance.tsv) ] from ABOTYPERCORE_PILEUP2METRICS"
  - ch_bam_stats:
      type: channel
      description: "[ val(meta), path(*.stats) ] from SAMTOOLS_STATS"
  - ch_bam_flagstat:
      type: channel
      description: "[ val(meta), path(*.flagstat) ] from SAMTOOLS_FLAGSTAT"
  - ch_panel:
      type: file
      description: |
        ABO variant panel file (params.abo_panel), staged into ABOTYPERCORE_PREDICTPHENOTYPE and
        ABOTYPERCORE_AGGREGATE so they can read it on any executor.
      pattern: "*.{yaml,yml,json,csv,tsv}"
output:
  - abo_results:
      type: file
      description: |
        Aggregated ABO typing results text file containing phenotype, genotype,
        extended genotype (with A1/A2 subtypes), Bw subtype flags, phase confidence,
        and reliability scores for all samples.
        Structure: [ path(ABO_result.txt) ]
      pattern: "ABO_result.txt"
  - evidence_summary:
      type: file
      description: |
        Per-sample evidence summary (Clair3 and BAM pileup) as a MultiQC custom-content table.
        Structure: [ path(ABO_evidence_summary_mqc.tsv) ]
      pattern: "ABO_evidence_summary_mqc.tsv"
authors:
  - "@fmobegi"
maintainers:
  - "@fmobegi"
