# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "UTILS_NFCORE_ABOTYPER_PIPELINE"
description: |
  Subworkflows with functionality specific to the nf-core/abotyper pipeline:
  PIPELINE_INITIALISATION (version and help handling, parameter and samplesheet
  validation, welcome log) and PIPELINE_COMPLETION (completion summary and
  email). Also provides the methods-description and citation text for MultiQC.
keywords:
  - utility
  - pipeline
  - initialise
  - completion
  - samplesheet
  - abotyper
components:
  - utils_nfschema_plugin
  - utils_nfcore_pipeline
  - utils_nextflow_pipeline
input:
  - version:
      type: boolean
      description: Display the pipeline version and exit.
  - validate_params:
      type: boolean
      description: Whether to validate parameters against the schema at runtime.
  - monochrome_logs:
      type: boolean
      description: Do not use coloured log outputs.
  - nextflow_cli_args:
      type: list
      description: Nextflow CLI positional arguments.
  - outdir:
      type: string
      description: The output directory where the results will be saved.
  - input:
      type: string
      description: Path to the input samplesheet (comma-separated, validated against `assets/schema_input.json`).
  - help:
      type: boolean
      description: Display the help message and exit.
  - help_full:
      type: boolean
      description: Show the full help message.
  - show_hidden:
      type: boolean
      description: Show hidden parameters in the help message.
output:
  - samplesheet:
      type: file
      description: |
        Channel of validated samples.
        Structure: [ val(meta), [ path(fastq) ] ]
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
authors:
  - "@fmobegi"
maintainers:
  - "@fmobegi"
